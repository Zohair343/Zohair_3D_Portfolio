<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playable Pages: trailer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 900; src: url(fonts/barlow-condensed-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Atkinson'; font-weight: 700; src: url(fonts/atkinson-hyperlegible-next-latin-700-normal.woff2) format('woff2'); }
  :root { --ink: #1a1612; --paper: #f4ecdc; --caption: #f7e39a; --accent: #d9822b; --teal: #2f5d62; --red: #c8452c; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--accent);
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; color: var(--ink); }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  .dots { background-image: radial-gradient(circle, rgba(26,22,18,.22) 2.2px, transparent 2.7px); background-size: 18px 18px; }
  .dots-light { background-image: radial-gradient(circle, rgba(255,255,255,.18) 2.2px, transparent 2.7px); background-size: 18px 18px; }
  .panel { position: absolute; background: var(--paper); border: 10px solid var(--ink); box-shadow: 16px 16px 0 var(--ink); overflow: hidden; }
  .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cap { position: absolute; background: var(--caption); border: 6px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; padding: 6px 22px; white-space: nowrap; }
  .big { font-weight: 900; text-transform: uppercase; line-height: .86; white-space: nowrap; color: var(--paper);
    -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 12px 12px 0 var(--ink); }
  .bubble { position: absolute; background: #fff; border: 7px solid var(--ink); border-radius: 50%; padding: 34px 54px; font-weight: 900; font-size: 64px; text-transform: uppercase; white-space: nowrap; box-shadow: 10px 10px 0 var(--ink); }
  .bubble::after { content: ''; position: absolute; left: 70px; bottom: -58px; border: 30px solid transparent; border-top: 60px solid var(--ink); border-left-width: 6px; transform: skewX(18deg); }
  .bubble::before { content: ''; position: absolute; left: 80px; bottom: -40px; border: 22px solid transparent; border-top: 46px solid #fff; border-left-width: 4px; transform: skewX(18deg); z-index: 1; }
  .sfx { position: absolute; font-weight: 900; text-transform: uppercase; color: var(--caption); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 8px 8px 0 var(--ink); white-space: nowrap; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .lines line { stroke: var(--ink); }
  .wipe { position: absolute; top: -200px; height: 1480px; width: 900px; background: var(--ink); }
  .url { font-family: 'Atkinson', sans-serif; font-weight: 700; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./video.js"></script>
</body>
</html>
